version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    rebase-strategy: 'disabled'
    cooldown:
      default-days: 5
    groups:
      # Collect all Patch-Updates into one PR.
      patch-updates:
        applies-to: version-updates
        update-types:
          - patch
        patterns:
          - '*'
      # Collect all Minor-Updates into one PR.
      minor-updates:
        applies-to: version-updates
        update-types:
          - minor
        patterns:
          - '*'
      # Collect all Major OTEL Updates into one PR.
      otel-major-updates:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - '@opentelemetry/*'
      # Collect all Major Nest.Js Updates into one PR.
      nestjs-major-updates:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - '@nestjs/*'
      # All other major versions get their own PR.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
