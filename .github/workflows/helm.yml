name: Build and Push Helm Chart
on:
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Chart version to set'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE: vidis-provisionierungs-api
  REPOSITORY: ${{ github.repository_owner }}

jobs:
  build:
    name: Build Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: lowercase repository
        run: echo "REPOSITORY=${REPOSITORY,,}" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Push Chart
        uses: appany/helm-oci-chart-releaser@d94988c92bed2e09c6113981f15f8bb495d10943 # v0.5.0
        with:
          registry: ${{ env.REGISTRY }}
          repository: ${{ env.REPOSITORY }}
          name: ${{ env.IMAGE }}
          tag: ${{ inputs.chart_version }}
          path: charts/provisionierungs-api
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
